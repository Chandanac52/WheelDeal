name: wheeldeal
description: "A new Flutter project."

publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  flutter_riverpod: ^2.6.1
  go_router: ^16.0.0
  google_fonts: ^6.3.0
  flutter_svg: ^2.2.0
  cached_network_image: ^3.4.1
  flutter_screenutil: ^5.9.3
  smooth_page_indicator: ^1.2.1
  flutter_rating_bar: ^4.0.1
  intl: ^0.20.2
  shimmer: ^3.0.0
  iconsax_flutter: ^1.0.1
  http: ^1.4.0
  url_launcher: ^6.3.1
  image_picker: ^1.1.2
  flutter_secure_storage: ^9.2.2
  firebase_core: ^3.8.0
  firebase_auth: ^5.3.3
  pin_code_fields: ^8.0.1
  socket_io_client: ^3.0.2
  http_parser: ^4.1.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
     - assets/images/
     - assets/images/cars/
     - assets/images/dealers/
     - assets/images/banners/
     - assets/images/avatars/
     - assets/icons/
     - assets/animations/